<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Profundo preenchendo a tela inteira -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181d24" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </radialGradient>

    <!-- Gradiente Neon Ciano -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Gradiente para o Diapasão Metálico -->
    <linearGradient id="fork-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Efeito de Brilho / Glow Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Total Sangrado: sem borda e sem cantos arredondados para não vazar linhas no Android -->
  <rect width="512" height="512" fill="url(#bg-grad)" />

  <!-- Grupo com escala reduzida para caber perfeitamente na Safe Zone da máscara do celular -->
  <g transform="translate(256, 256) scale(0.84) translate(-256, -256)">
    <!-- Silhueta da Pirâmide do Metrônomo -->
    <path d="M 256 65 L 392 390 L 120 390 Z" 
          fill="none" 
          stroke="#1e293b" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Diapasão Acústico (Braços em 'U' centrados) -->
    <path d="M 195 160 L 195 265 C 195 320, 317 320, 317 265 L 317 160" 
          fill="none" 
          stroke="url(#fork-metal)" 
          stroke-width="16" 
          stroke-linecap="round" 
          filter="url(#glow)" />

    <!-- Haste do diapasão descendo até o pivot -->
    <line x1="256" y1="294" x2="256" y2="340" 
          stroke="url(#fork-metal)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Arco de afinação superior -->
    <path d="M 176 138 A 100 100 0 0 1 336 138" 
          fill="none" 
          stroke="#334155" 
          stroke-width="8" 
          stroke-dasharray="6 12" 
          stroke-linecap="round" />

    <!-- Ponto central verde neon -->
    <circle cx="256" cy="88" r="8" fill="#22c55e" filter="url(#glow)" />

    <!-- Pêndulo / Agulha Dinâmica do Metrônomo -->
    <line x1="256" y1="340" x2="298" y2="95" 
          stroke="url(#neon-cyan)" 
          stroke-width="13" 
          stroke-linecap="round" 
          filter="url(#glow)" />

    <!-- Peso móvel do metrônomo -->
    <rect x="276" y="172" width="22" height="30" rx="4"
          fill="#00d2d3" 
          stroke="#ffffff" 
          stroke-width="3" 
          transform="rotate(10 287 187)" />

    <!-- Pivot / Eixo Central -->
    <circle cx="256" cy="340" r="20" fill="#0d1117" stroke="#00d2d3" stroke-width="6" />
    <circle cx="256" cy="340" r="8" fill="#22c55e" filter="url(#glow)" />

    <!-- Placa de base para a frequência -->
    <rect x="180" y="375" width="152" height="32" rx="6" fill="#141a22" stroke="#1f2937" stroke-width="2" />

    <!-- Inscrição 440 Hz -->
    <text x="256" y="398" 
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="3" 
          fill="#00d2d3" 
          text-anchor="middle"
          filter="url(#glow)">440 Hz</text>
  </g>
</svg>
