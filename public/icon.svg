<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Profundo -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </radialGradient>

    <!-- Gradiente Neon Ciano -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Gradiente para o Diapasão Metálico -->
    <linearGradient id="fork-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Efeito de Brilho / Glow Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (squircle padrão de app) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#22272e" stroke-width="6" />

  <!-- Silhueta da Pirâmide do Metrônomo -->
  <path d="M 256 60 L 396 395 L 116 395 Z" 
        fill="none" 
        stroke="#1e293b" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Diapasão Acústico (Braços em 'U' centrados) -->
  <path d="M 195 160 L 195 270 C 195 325, 317 325, 317 270 L 317 160" 
        fill="none" 
        stroke="url(#fork-metal)" 
        stroke-width="16" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Base / Haste do diapasão descendo até o pivot -->
  <line x1="256" y1="298" x2="256" y2="345" 
        stroke="url(#fork-metal)" 
        stroke-width="16" 
        stroke-linecap="round" />

  <!-- Arco de afinação superior com o ponto central verde neon -->
  <path d="M 176 138 A 100 100 0 0 1 336 138" 
        fill="none" 
        stroke="#334155" 
        stroke-width="8" 
        stroke-dasharray="6 12" 
        stroke-linecap="round" />

  <circle cx="256" cy="88" r="8" fill="#22c55e" filter="url(#glow)" />

  <!-- Pêndulo / Agulha Dinâmica do Metrônomo (Inclinada marcando o tempo) -->
  <line x1="256" y1="345" x2="298" y2="95" 
        stroke="url(#neon-cyan)" 
        stroke-width="13" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Bloco contrapeso do pêndulo mecânico -->
  <rect x="276" y="175" width="22" height="30" rx="4"
        fill="#00d2d3" 
        stroke="#ffffff" 
        stroke-width="3" 
        transform="rotate(10 287 190)" />

  <!-- Pivot / Eixo Central do Pêndulo -->
  <circle cx="256" cy="345" r="20" fill="#0d1117" stroke="#00d2d3" stroke-width="6" />
  <circle cx="256" cy="345" r="8" fill="#22c55e" filter="url(#glow)" />

  <!-- Recorte da base para a inscrição de calibração -->
  <rect x="180" y="380" width="152" height="32" rx="6" fill="#141a22" stroke="#1f2937" stroke-width="2" />

  <!-- 440 Hz centralizado na linha de base do triângulo -->
  <text x="256" y="403" 
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="3" 
        fill="#00d2d3" 
        text-anchor="middle"
        filter="url(#glow)">440 Hz</text>
</svg>
